<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f5">
  <title>点滴 · 置底按钮动效</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main id="stage" aria-label="点滴记录交互示例">
    <div id="screen">
      <img class="plate" src="assets/bottom-plate-2x.png" alt="">
      <div id="records" aria-label="记录内容，可上下滑动" tabindex="0">
        <img id="content" src="assets/content-2x.png" alt="体重记录与趋势">
        <div id="end-space" aria-hidden="true"></div>
      </div>
      <div class="fixed-header" aria-hidden="true"><img src="assets/bottom-plate-2x.png" alt=""></div>
      <div id="panel" aria-hidden="true"><img src="assets/bottom-plate-2x.png" alt=""></div>
      <div class="fixed-tabs" aria-hidden="true"><img src="assets/bottom-plate-2x.png" alt=""></div>
      <button id="to-bottom" type="button" aria-label="回到最新记录">
        <span class="button-shape"><img class="button-base" src="assets/button-base-2x.png" alt=""><img class="arrow" src="assets/arrow.svg" alt=""></span>
      </button>
    </div>
  </main>
  <script src="app.js?v=7"></script>
</body>
</html>
